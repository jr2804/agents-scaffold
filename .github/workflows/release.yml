name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install tools
        run: mise install

      - name: Verify repository
        run: mise run check

      - name: Compute CalVer tag
        id: calver
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PREFIX="${YEAR}.${MONTH}."
          LAST=$(git tag -l "${PREFIX}*" | sort -V | tail -1)
          if [ -z "$LAST" ]; then
            NEXT="${PREFIX}1"
          else
            PATCH="${LAST#"$PREFIX"}"
            if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid CalVer tag: $LAST" >&2
              exit 1
            fi
            NEXT="${PREFIX}$((10#$PATCH + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
