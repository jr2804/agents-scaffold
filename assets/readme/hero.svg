<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">agents-scaffold — self-documenting AGENTS.md hierarchy</title>
  <desc id="hero-desc">Project name and one-line value on the left; on the right, a card showing the DOX file tree: AGENTS.md at the root and demand-loaded files under .agents/.</desc>

  <!-- Canvas -->
  <rect width="1200" height="340" rx="20" fill="#0F172A"/>

  <!-- Left: title block -->
  <g transform="translate(56 40)">
    <!-- Eyebrow with accent bar (project-native motif cue) -->
    <rect x="0" y="0" width="3" height="22" fill="#14B8A6"/>
    <text x="14" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#14B8A6">AGENT CONVENTION · DOX</text>

    <!-- Project name -->
    <text x="0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="700" fill="#F1F5F9">agents-scaffold</text>

    <!-- Subtitle -->
    <text x="0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#94A3B8">Self-documenting AGENTS.md hierarchy for any repository.</text>

    <!-- Metadata line -->
    <text x="0" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748B">lean root · 5 demand-loaded files · subtree contracts</text>
  </g>

  <!-- Right: DOX hierarchy card -->
  <g transform="translate(740 46)">
    <!-- Card frame -->
    <rect x="0" y="0" width="404" height="248" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Card header -->
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#64748B">DOX HIERARCHY</text>
    <line x1="20" y1="42" x2="384" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- Tree content -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F1F5F9">
      <text x="20" y="74">AGENTS.md</text>
      <rect x="240" y="60" width="74" height="22" rx="11" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-width="1"/>
      <text x="277" y="76" text-anchor="middle" font-size="12" fill="#14B8A6" letter-spacing="1">ALWAYS</text>

      <text x="20" y="104" fill="#94A3B8">.agents/</text>

      <text x="20" y="130">├─ ONBOARDING.md</text>
      <text x="20" y="154">├─ POLICIES.md</text>
      <text x="20" y="178">├─ FILES.md</text>
      <text x="20" y="202">├─ HISTORY.md</text>
      <text x="20" y="226">└─ MAINTENANCE.md</text>
    </g>
  </g>
</svg>
